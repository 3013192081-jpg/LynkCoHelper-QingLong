name: extract-appsecret
on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::no /dev/kvm, software emulation (slower)"
          fi

      - name: Extract AppSecret (x86_64 + KVM)
        id: extract
        env:
          EMU_HEADLESS: "1"
          LYNKCO_AUTO_WRITE: "1"
          LYNKCO_IMAGE_ABI: "x86_64"
        run: python3 LynkCoHelper/tools/extract_appsecret_github_action.py

      - name: Gen one-time burn link with all 4 fields
        if: success()
        run: |
          python3 - <<'EOF'
          import json, time, urllib.parse, urllib.request

          with open("LynkCoHelper/env.json", encoding="utf-8") as f:
              sec = json.load(f).get("secrets", {})
          key = sec.get("nativeAppKey", "")
          secret = sec.get("nativeAppSecret", "")
          appcode = sec.get("nativeAppCode", "")
          gldevid = sec.get("glDevId", "")
          if not (key and secret):
              print("[!] key/secret not found in env.json, skip burn link")
              raise SystemExit(0)

          data = urllib.parse.urlencode({
              "content": f"nativeAppKey: {key}\n"
                         f"nativeAppSecret: {secret}\n"
                         f"nativeAppCode: {appcode}\n"
                         f"glDevId: {gldevid}",
              "ttl": "600",
          }).encode()
          r = None
          for attempt in range(3):
              req = urllib.request.Request(
                  "https://api.cloudcpp.com/burn", data=data, method="POST",
                  headers={"User-Agent": "LynkCoHelper-extract/1.0",
                           "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      r = json.load(resp)
                  break
              except Exception as e:
                  print(f"[!] attempt {attempt + 1} failed: {e}")
                  if attempt < 2:
                      time.sleep(5)
          if not r or not r.get("link"):
              print("[!] burn link generation failed, env.json is lost with runner")
              raise SystemExit(1)
          print("[+] one-time burn link (open once, 10 min):")
          print(f"    {r['link']}")
          EOF
