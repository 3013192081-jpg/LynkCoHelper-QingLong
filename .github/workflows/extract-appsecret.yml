# 鎵嬪姩瑙﹀彂銆傚湪 GitHub 鎵樼 ubuntu-latest锛坸86_64锛岃嚜甯?/dev/kvm锛変笂
# 浠庨浂瀹屾垚鎻愬彇锛屽叏绋嬫棤浜哄€煎畧锛氳嚜鍔ㄤ笅杞?emulator + x86_64 API33 绯荤粺闀滃儚
# 锛坓oogle_apis锛? 鏈€鏂?APK -> 鏃犲ご鍐峰惎鍔紙KVM 鍔犻€燂紝绾?2~5 鍒嗛挓锛?# -> 鏂偣鎻愬彇 -> 鍐?env.json銆?# 涓轰綍榛樿 x86_64 闀滃儚锛?026-09-06 瀹炴祴锛岃瑙?docs/鏈湴涓€閿彁鍙栨寚鍗?md
# 绗?2 鑺傦級锛歛rm64 闀滃儚璺嚎涓嶅彲鏁戔€斺€攁rm64 ranchu 铏氭嫙鏈烘病鏈?PCI 鎬荤嚎锛?# 鑰?31.3.10/36.2.12 鐨?qemu fork 浼氭棤鏉′欢鍒濆鍖?virtio-snd-pci锛?# "PCI bus not available" 鐩存帴鑷村懡涓旀棤鍙傛暟鍙粫銆倄86_64 闀滃儚涓嬪姞鍥哄３鐨?# arm64 鍘熺敓搴撶粡 libndk 缈昏瘧鎵ц锛屽彲瀛樻椿鍒?<clinit>锛屾湰鍦帮紙WSL2+KVM锛?# 宸插疄娴嬭窇閫氥€侫BI 宸插啓姝?x86_64锛堣剼鏈己鐪?arm64-v8a 鐨勮矾绾垮凡璇佸疄涓嶅彲琛岋級銆?# 鎻愬彇缁撴灉浠呭瓨鍦ㄤ簬鏈杩愯鐨?env.json锛坮unner 閿€姣佸嵆涓級锛岄€氳繃涓€娆℃€ч摼鎺?# 閫佽揪锛氶摼鎺ユ墦鍗板湪杩愯鏃ュ織閲岋紝浠呭彲鎵撳紑 1 娆°€?0 鍒嗛挓鍚庡け鏁堬紙闃呭悗鍗崇剼锛?# api.cloudcpp.com 鎵樼锛屽浗鍐呯洿杩炲弸濂斤級銆傞摼鎺ユ湰韬殢鍏紑鏃ュ織鍙锛屽凡纭
# 涓嶄緷璧栭摼鎺ヤ繚瀵嗘€с€?on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 寮€鏀?KVM 鏉冮檺锛堟ā鎷熷櫒鍔犻€熺敤锛?        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::runner 鏃?/dev/kvm锛屽皢閫€鍖栦负绾蒋浠舵ā鎷燂紙x86_64 闀滃儚涓嬩粛鍙繍琛岋紝鍙槸鎱級"
          fi

      - name: 鎻愬彇 AppSecret锛坸86_64 闀滃儚 + KVM -> 鍐峰惎鍔?-> 鏂偣鎻愬彇锛?        id: extract
        env:
          EMU_HEADLESS: "1"        # 鏃犲ご妯″紡锛堟棤 DISPLAY 鏃惰剼鏈篃浼氳嚜鍔ㄥ垏鎹級
          LYNKCO_AUTO_WRITE: "1"   # 鍏嶄氦浜掔‘璁わ紝鑷姩鍐欏叆 env.json
          LYNKCO_IMAGE_ABI: "x86_64"  # 鍐欐锛堣剼鏈己鐪佹槸 arm64-v8a锛岃璺嚎宸茶瘉瀹炰笉鍙锛涘嬁鍒狅級
        run: python3 LynkCoHelper/tools/extract_appsecret_github_action.py

      # 妯℃嫙鍣ㄦ帓闅滀笁浠跺锛氬涓荤鐩?鍐呭瓨/鍐呮牳鏃ュ織锛圤OM killer 鍙?SIGKILL
      # 鍙兘浠?dmesg 鐪嬪埌锛涚鐩樼垎鐩?qemu 鍒濆鍖栧嵆姝讳笖鎶ラ敊鏅︽订锛?      - name: 澶辫触璇婃柇锛堢鐩?鍐呭瓨/鍐呮牳鏃ュ織锛?        if: failure()
        run: |
          echo "=== df -h ==="; df -h || true
          echo "=== free -h ==="; free -h || true
          echo "=== dmesg 鏈熬锛堢湅 OOM killer锛?=="; sudo dmesg 2>/dev/null | tail -40 || true

      - name: 涓婁紶妯℃嫙鍣ㄥ畬鏁存棩蹇楋紙澶辫触璇婃柇锛?        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-log
          path: /home/runner/.lynkco-helper-tools/emulator.log
          if-no-files-found: ignore

      - name: 鐢熸垚涓€娆℃€у彇浠堕摼鎺ワ紙闃呭悗鍗崇剼锛氫粎鍙墦寮€ 1 娆★紝10 鍒嗛挓鍚庡け鏁堬級
        if: success()
        run: |
          python3 - <<'EOF'
          import json, time, urllib.parse, urllib.request

          with open("LynkCoHelper/env.json", encoding="utf-8") as f:
              sec = json.load(f).get("secrets", {})
          key = sec.get("nativeAppKey", "")
          secret = sec.get("nativeAppSecret", "")
          appcode = sec.get("nativeAppCode", "")
          gldevid = sec.get("glDevId", "")
          if not (key and secret):
              print("[!] env.json 涓湭鎵惧埌瀵嗛挜锛岃烦杩囦竴娆℃€ч摼鎺ョ敓鎴?)
              raise SystemExit(0)

          # api.cloudcpp.com锛圓PI Center 闃呭悗鍗崇剼锛屽浗鍐呯洿杩炲弸濂斤級锛?          # ttl=600 绉掑厹搴曡繃鏈燂紝閾炬帴琚墦寮€ 1 娆″悗鍐呭鍗崇剼姣併€?          # 闇€ Accept: application/json锛堢己澶卞垯杩斿洖 HTML 琛ㄥ崟椤碉級锛涘甫閲嶈瘯銆?          data = urllib.parse.urlencode({
              "content": f"nativeAppKey: {key}\n"
                         f"nativeAppSecret: {secret}\n"
                         f"nativeAppCode: {appcode}\n"
                         f"glDevId: {gldevid}",
              "ttl": "600",
          }).encode()
          r = None
          for attempt in range(3):
              req = urllib.request.Request(
                  "https://api.cloudcpp.com/burn", data=data, method="POST",
                  headers={"User-Agent": "LynkCoHelper-extract/1.0",
                           "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      r = json.load(resp)
                  break
              except Exception as e:
                  print(f"[!] 绗?{attempt + 1} 娆¤姹傚け璐? {e}")
                  if attempt < 2:
                      time.sleep(5)
          if not r or not r.get("link"):
              print("[!] 涓€娆℃€ч摼鎺ョ敓鎴愬け璐ワ紝env.json 宸查殢 runner 閿€姣侊紝"
                    "璇烽噸璺?workflow 鎴栨敼鐢ㄦ湰鍦版彁鍙?)
              raise SystemExit(1)
          print("[+] 涓€娆℃€у彇浠堕摼鎺ワ紙浠呭彲鎵撳紑 1 娆★紝10 鍒嗛挓鍚庡け鏁堬級锛?)
          print(f"    {r['link']}")
          EOF
